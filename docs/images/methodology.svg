<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect width="1200" height="630" fill="#F7F5F2"/>
  <rect x="0" y="0" width="1200" height="10" fill="#D9550F"/>

  <!-- axes -->
  <g stroke="#CCCCCC" stroke-width="3">
    <line x1="320" y1="500" x2="320" y2="140"/>
    <line x1="320" y1="500" x2="860" y2="500"/>
  </g>
  <path d="M320 140 L308 164 L332 164 Z" fill="#CCCCCC"/>
  <path d="M860 500 L836 488 L836 512 Z" fill="#CCCCCC"/>

  <!-- scatter cloud, elongated diagonally like correlated variables -->
  <g>
    <circle cx="380" cy="440" r="14" fill="#FBDCC0"/>
    <circle cx="430" cy="410" r="16" fill="#F5B788"/>
    <circle cx="470" cy="430" r="12" fill="#F3B483"/>
    <circle cx="500" cy="370" r="15" fill="#F2903C"/>
    <circle cx="540" cy="390" r="13" fill="#F0812E"/>
    <circle cx="580" cy="330" r="16" fill="#F0812E"/>
    <circle cx="610" cy="350" r="12" fill="#D9550F"/>
    <circle cx="650" cy="290" r="15" fill="#D9550F"/>
    <circle cx="690" cy="310" r="13" fill="#8A3A0A"/>
    <circle cx="720" cy="255" r="16" fill="#8A3A0A"/>
    <circle cx="440" cy="460" r="11" fill="#FBDCC0"/>
    <circle cx="560" cy="420" r="11" fill="#F3B483"/>
    <circle cx="630" cy="370" r="11" fill="#F0812E"/>
  </g>

  <!-- principal component line through the cloud -->
  <line x1="360" y1="470" x2="770" y2="230" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
  <path d="M770 230 L742 236 L764 258 Z" fill="#3A3A3A"/>

  <!-- secondary component, perpendicular, shorter and muted -->
  <line x1="470" y1="330" x2="590" y2="410" stroke="#6E6E6E" stroke-width="4" stroke-dasharray="4 8" stroke-linecap="round"/>
</svg>
