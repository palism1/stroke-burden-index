  <circle cx="898" cy="315" r="60" fill="#8A3A0A"/>
  <!-- node icon 4: checkmark output -->
  <path d="M878 315 L892 330 L920 298" fill="none" stroke="#FBDCC0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrowheads along the pipeline -->
  <path d="M370 315 L352 305 L352 325 Z" fill="#CCCCCC"/>
  <path d="M576 315 L558 305 L558 325 Z" fill="#CCCCCC"/>
  <path d="M782 315 L764 305 L764 325 Z" fill="#CCCCCC"/>
