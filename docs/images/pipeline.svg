<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect width="1200" height="630" fill="#F7F5F2"/>
  <rect x="0" y="0" width="1200" height="10" fill="#D9550F"/>

  <!-- connecting pipeline line -->
  <line x1="280" y1="315" x2="900" y2="315" stroke="#CCCCCC" stroke-width="6"/>

  <!-- node 1 -->
  <circle cx="280" cy="315" r="60" fill="#FBDCC0"/>
  <rect x="252" y="287" width="56" height="56" rx="10" fill="#FBDCC0" opacity="0"/>
  <path d="M258 315 h44 M280 293 v44" stroke="#8A3A0A" stroke-width="0" />

  <!-- node icon 1: raw data (small dots) -->
  <circle cx="264" cy="304" r="7" fill="#8A3A0A"/>
  <circle cx="296" cy="304" r="7" fill="#8A3A0A"/>
  <circle cx="280" cy="330" r="7" fill="#8A3A0A"/>

  <!-- node 2 -->
  <circle cx="486" cy="315" r="60" fill="#F3B483"/>
  <!-- node icon 2: gear-ish process (simple ring) -->
  <circle cx="486" cy="315" r="26" fill="none" stroke="#8A3A0A" stroke-width="8"/>
  <circle cx="486" cy="315" r="8" fill="#8A3A0A"/>

  <!-- node 3 -->
  <circle cx="692" cy="315" r="60" fill="#F0812E"/>
  <!-- node icon 3: bars (scoring) -->
  <rect x="668" y="330" width="14" height="20" fill="#3A3A3A"/>
  <rect x="686" y="315" width="14" height="35" fill="#3A3A3A"/>
  <rect x="704" y="300" width="14" height="50" fill="#3A3A3A"/>

