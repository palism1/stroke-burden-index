<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect width="1200" height="630" fill="#F7F5F2"/>
  <rect x="0" y="0" width="1200" height="10" fill="#D9550F"/>

  <!-- four database cylinders representing multiple sources feeding in -->
  <!-- cylinder 1 -->
  <g>
    <ellipse cx="380" cy="200" rx="90" ry="30" fill="#FBDCC0"/>
    <rect x="290" y="200" width="180" height="60" fill="#FBDCC0"/>
    <ellipse cx="380" cy="260" rx="90" ry="30" fill="#F5B788"/>
  </g>

  <!-- cylinder 2 -->
  <g>
    <ellipse cx="380" cy="300" rx="90" ry="30" fill="#F3B483"/>
    <rect x="290" y="300" width="180" height="60" fill="#F3B483"/>
    <ellipse cx="380" cy="360" rx="90" ry="30" fill="#F0812E"/>
  </g>

  <!-- cylinder 3 -->
  <g>
    <ellipse cx="380" cy="400" rx="90" ry="30" fill="#F2903C"/>
    <rect x="290" y="400" width="180" height="60" fill="#F2903C"/>
    <ellipse cx="380" cy="460" rx="90" ry="30" fill="#D9550F"/>
  </g>

  <!-- arrows converging into a single merged cylinder on the right -->
  <path d="M490 230 C 620 250, 650 300, 700 300" fill="none" stroke="#CCCCCC" stroke-width="5"/>
  <path d="M490 330 C 600 330, 640 315, 700 315" fill="none" stroke="#CCCCCC" stroke-width="5"/>
  <path d="M490 430 C 620 400, 650 330, 700 330" fill="none" stroke="#CCCCCC" stroke-width="5"/>
  <path d="M700 300 L 690 288 L 715 296 Z" fill="#CCCCCC"/>

  <!-- merged / unified cylinder -->
  <g>
    <ellipse cx="820" cy="290" rx="100" ry="34" fill="#8A3A0A"/>
    <rect x="720" y="290" width="200" height="90" fill="#8A3A0A"/>
    <ellipse cx="820" cy="380" rx="100" ry="34" fill="#5C2606"/>
    <ellipse cx="820" cy="290" rx="100" ry="34" fill="#A8460D"/>
  </g>
</svg>
