<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F3B483"/>
      <stop offset="100%" stop-color="#D9550F"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#F7F5F2"/>
  <rect x="0" y="0" width="1200" height="10" fill="#D9550F"/>

  <!-- ground line -->
  <line x1="260" y1="470" x2="940" y2="470" stroke="#CCCCCC" stroke-width="3"/>

  <!-- ascending bars, sequential palette light to dark -->
  <rect x="300" y="390" width="90" height="80" rx="10" fill="#FBDCC0"/>
  <rect x="420" y="330" width="90" height="140" rx="10" fill="#F3B483"/>
  <rect x="540" y="260" width="90" height="210" rx="10" fill="#F0812E"/>
  <rect x="660" y="180" width="90" height="290" rx="10" fill="#D9550F"/>
  <rect x="780" y="120" width="90" height="350" rx="10" fill="#8A3A0A"/>

  <!-- flag pole on tallest bar -->
  <line x1="825" y1="120" x2="825" y2="40" stroke="#3A3A3A" stroke-width="6" stroke-linecap="round"/>

  <!-- flag with checkmark -->
  <g transform="translate(825,40)">
    <path d="M0 0 L110 22 L0 44 Z" fill="#3A3A3A"/>
    <path d="M22 22 L38 36 L70 8" fill="none" stroke="#FBDCC0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
