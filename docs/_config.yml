# Jekyll config for GitHub Pages. Source folder is /docs (Settings > Pages).
#
# Theme: Zolan (github.com/artemsheludko/zolan), VENDORED into this folder —
# fork-style theme, copied in rather than remote_theme so it works under the
# project baseurl and we control the accent/accessibility. Adaptations from
# upstream: jekyll/tagging removed (not whitelisted on GitHub Pages), tag UI
# stripped, hero repurposed for the project, nav lists only pages that opt in
# via `nav_public: true` (internal docs stay hosted but unlisted), brand color
# switched to the project orange (#c2410c, WCAG AA on white).
title: Stroke Burden Index
description: Identifying high-priority stroke intervention areas in the US.

markdown: kramdown

plugins:
  - jekyll-paginate
  - jekyll-sitemap

paginate: 10
paginate_path: "/page/:num"

# Section posts get clean URLs; ordinary pages keep their existing .html
# paths (plan.html, DECISIONS.html etc. are linked from code and the README).
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: "/:title/"
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

include:
  - _pages

sass:
  sass_dir: _sass
  style: compressed

# NOTE: no exclude/include rules beyond _pages — Jekyll must keep copying
# dashboard/ and data/ verbatim (no front matter there, passed through).
