name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      # Smoke-run both pipeline entry points so a data file that breaks the
      # merge fails the PR, not someone's next local run. Outputs are gitignored.
      - run: python src/merge.py
      # Index scores are derived from the data and committed to data/indices.csv.
      # Recompute them and fail if the committed copy is stale — proves the
      # scores still match the data they claim to summarize.
      - run: python src/compute_indices.py
      - run: git diff --exit-code data/indices.csv
      - run: python src/build_db.py
      # Regenerate the dashboard's data files and fail if the committed
      # copies are stale (someone changed data without re-exporting).
      - run: python src/build_site_data.py
      - run: git diff --exit-code docs/data/
      # git diff ignores untracked files, so also fail if regeneration
      # created a new file under docs/data/ that isn't committed.
      - run: test -z "$(git status --porcelain docs/data/)"
